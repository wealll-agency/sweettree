$kind: http-request
name: Update Banner
method: PUT
url: '{{baseUrl}}/api/banners/:id'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
pathVariables:
  - key: id
    value: BANNER_ID
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated Banner"
    }
