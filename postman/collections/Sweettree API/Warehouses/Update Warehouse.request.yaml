$kind: http-request
name: Update Warehouse
method: PUT
url: '{{baseUrl}}/api/warehouses/:id'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
pathVariables:
  - key: id
    value: WAREHOUSE_ID
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated Warehouse"
    }
