$kind: http-request
name: Update Product
method: PUT
url: '{{baseUrl}}/api/products/:id'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
pathVariables:
  - key: id
    value: PRODUCT_ID
body:
  type: formdata
  content:
    - key: name
      type: text
      value: Updated Product Name
    - key: price
      type: text
      value: '599'
