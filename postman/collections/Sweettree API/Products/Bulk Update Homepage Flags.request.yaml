$kind: http-request
name: Bulk Update Homepage Flags
method: PUT
url: '{{baseUrl}}/api/products/homepage/bulk-flags'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "flags": []
    }
