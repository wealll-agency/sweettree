$kind: http-request
name: Create Combo
method: POST
url: '{{baseUrl}}/api/combos/admin'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Combo Pack",
      "products": [],
      "price": 999
    }
