$kind: http-request
name: Update Combo
method: PUT
url: '{{baseUrl}}/api/combos/admin/:id'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
pathVariables:
  - key: id
    value: COMBO_ID
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated Combo"
    }
