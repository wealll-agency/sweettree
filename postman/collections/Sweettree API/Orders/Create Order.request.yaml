$kind: http-request
name: Create Order
method: POST
url: '{{baseUrl}}/api/orders'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "items": [],
      "shippingAddress": {}
    }
