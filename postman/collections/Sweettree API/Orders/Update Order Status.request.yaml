$kind: http-request
name: Update Order Status
method: PUT
url: '{{baseUrl}}/api/orders/:id/status'
order: 11000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
pathVariables:
  - key: id
    value: ORDER_ID
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "Processing"
    }
