$kind: http-request
name: Process Refund
method: POST
url: '{{baseUrl}}/api/orders/:id/refund'
order: 13000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
pathVariables:
  - key: id
    value: ORDER_ID
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "Damaged product"
    }
