$kind: http-request
name: Update Refund Status
method: PUT
url: '{{baseUrl}}/api/refunds/:id/status'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
pathVariables:
  - key: id
    value: REFUND_ID
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "Approved"
    }
